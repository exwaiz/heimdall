[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall"
version = "0.1.0"
description = "Private Telegram bridge to existing Codex threads"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "jsonschema>=4.23,<5", "pypdf>=6,<7", "av>=16,<17", "Pillow>=12,<13"]

[project.scripts]
heimdall-bridge = "heimdall_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

